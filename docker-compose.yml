services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      CHECKPOINT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      SANDBOX_IMAGE: autopatch-sandbox:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - app_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

  sandbox-image:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: autopatch-sandbox:latest
    profiles:
      - build

volumes:
  redis_data:
  app_data:
